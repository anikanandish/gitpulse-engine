version: '3.8'

services:
  gitpulse:
    build: .
    container_name: gitpulse-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - GITPULSE_DB_FILE=/app/data/gitpulse.db
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - MAX_PAYLOAD_SIZE=${MAX_PAYLOAD_SIZE:-2097152}
    volumes:
      - gitpulse_data:/app/data

volumes:
  gitpulse_data:
